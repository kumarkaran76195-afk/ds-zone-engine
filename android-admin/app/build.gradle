plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karan.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.karan.admin"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
